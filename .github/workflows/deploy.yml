name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT: full history so git log --follow works

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get commit SHA
        id: get_commit_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install dependencies 📦
        run: npm ci
      - name: Generate index data
        run: npm run gen-index

      - name: Build 🔨
        run: npm run build:github
        env:
          VITE_COMMIT_SHA: ${{ steps.get_commit_sha.outputs.sha }}
          VITE_USE_HASH_ROUTER: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: neuronwiz.buildwizai.com  # Custom domain